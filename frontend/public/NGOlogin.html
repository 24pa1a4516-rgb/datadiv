<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>NGO Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #abf973, #7db7f1);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Card */
    .ngo-card {
      background: white;
      width: 360px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .ngo-card h2 {
      text-align: center;
      margin-bottom: 5px;
    }

    .ngo-card p {
      text-align: center;
      color: gray;
      margin-bottom: 25px;
    }

    /* Inputs */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
      color: #555;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 14px;
    }

    .form-group input:focus {
      border-color: #4f46e5;
    }

    /* Button */
    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #4f46e5;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #4338ca;
    }

    /* Footer text */
    .footer-text {
      text-align: center;
      font-size: 12px;
      color: gray;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="ngo-card">
    <h2 data-i18n="ngo_login_title">NGO Login</h2>
    <p data-i18n="road_issue_system">Road Issue Verification System</p>

    <div class="form-group">
      <label data-i18n="name_label">Name</label>
      <input type="text" id="name" data-i18n="name_placeholder" placeholder="Enter your name">
    </div>

    <div class="form-group">
      <label data-i18n="org_label">Organisation</label>
      <input type="text" id="org" data-i18n="org_placeholder" placeholder="NGO organisation name">
    </div>

    <div class="form-group">
      <label data-i18n="phone_label">Phone Number</label>
      <input type="tel" id="phone" data-i18n="phone_placeholder_10" placeholder="10-digit mobile number">
    </div>

    <div class="form-group">
      <label data-i18n="office_label">Head Office</label>
      <input type="text" id="office" data-i18n="office_placeholder" placeholder="City / Location">
    </div>

    <button onclick="submitForm()" data-i18n="proceed">Login</button>

    <div class="footer-text" data-i18n="authorized_ngo">
      Authorized NGO access only
    </div>
  </div>

  <script>
    function submitForm() {
      const name = document.getElementById("name").value.trim();
      const org = document.getElementById("org").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const office = document.getElementById("office").value.trim();

      if (!name || !org || !phone || !office) {
        alert("Please fill all details");
        return;
      }

      if (!/^[0-9]{10}$/.test(phone)) {
        alert("Enter a valid 10-digit phone number");
        return;
      }

      // Capture GPS and Register
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const userId = "ngo_" + phone;

          try {
            const response = await fetch("/api/register-ngo", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                userId, name, org, phone, location: office, lat, lng
              })
            });

            const data = await response.json();
            if (data.success) {
              localStorage.setItem("userId", userId);
              localStorage.setItem("ngoName", name);
              localStorage.setItem("ngoOrg", org);
              localStorage.setItem("phone", phone);
              localStorage.setItem("role", "ngo");
              window.location.href = "NGO.html";
            } else {
              alert("Registration failed: " + data.error);
            }
          } catch (err) {
            alert("Server connection error.");
          }
        }, () => {
          alert("GPS is required for NGO verification role. Please allow location access.");
        });
      } else {
        alert("Geolocation not supported on this device.");
      }
    }
  </script>

  <script src="lang.js"></script>
</body>

</html>
