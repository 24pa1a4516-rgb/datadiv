<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Farmer Community</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f8f9;
    }

    /* Header */
    .header {
      background: white;
      padding: 15px 30px;
      border-bottom: 1px solid #e5e7eb;
    }

    .header h2 {
      margin: 0;
    }

    .header p {
      margin-top: 5px;
      color: gray;
    }

    /* Layout */
    .container {
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: white;
      padding: 20px;
      border-right: 1px solid #e5e7eb;
      min-height: calc(100vh - 70px);
    }

    .sidebar a,
    .sidebar div {
      display: block;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      color: black;
    }

    .sidebar a:hover,
    .sidebar div:hover {
      background: #f3f4f6;
    }

    .sidebar .active {
      background: #ecfdf5;
      color: green;
      font-weight: bold;
    }

    /* Main */
    .main {
      flex: 1;
      padding: 30px;
    }

    /* Button */
    .add-btn {
      background: #0aa635;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Community list */
    #communityList {
      margin-top: 30px;
    }

    /* Card */
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .card h3 {
      margin: 0;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info {
      color: #444;
      margin: 6px 0;
    }

    .badge {
      background: #ecfdf5;
      color: green;
      padding: 5px 10px;
      border-radius: 12px;
      display: inline-block;
      font-size: 12px;
      margin-top: 8px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: red;
      font-size: 18px;
      cursor: pointer;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 25px;
      width: 360px;
      border-radius: 12px;
    }

    .modal-content input,
    .modal-content select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h2 data-i18n="farmer_community">👨‍🌾 Farmer Community</h2>
    <p data-i18n="community_desc">Small farmers come together and grow stronger</p>
  </div>

  <div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
      <a href="farmer.html" data-i18n="my_crops">🌱 My Crops</a>
      <div class="active" data-i18n="community">👨‍🌾 Community</div>
      <a href="transporters.html" data-i18n="transporters">🚚 Transporters</a>

    </div>

    <!-- Main -->
    <div class="main">
      <button class="add-btn" onclick="openModal()" data-i18n="join_community">+ Join Community</button>

      <div id="mlClusters" style="margin-top: 30px; display: none;">
        <h3 style="display: flex; align-items: center; gap: 10px;">
          🧠 Smart Groups <span class="badge" style="background:#1e5bff; color:white;">ML Recommended</span>
        </h3>
        <p style="color:gray; font-size:14px; margin-bottom:15px;">Optimized clusters for shared transportation based on
          location and volume.</p>
        <div id="clusterList"
          style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px;"></div>
      </div>

      <div id="communityList"></div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="communityModal">
    <div class="modal-content">
      <h3 data-i18n="farmer_details">Add Farmer Details</h3>

      <input type="text" id="farmerName" data-i18n="farmer_name_placeholder" placeholder="Farmer Name">

      <select id="cropType">
        <option value="" data-i18n="select_crop_placeholder">Select Crop</option>
        <option>Wheat</option>
        <option>Rice</option>
        <option>Corn</option>
        <option>Soybean</option>
        <option>Potato</option>
        <option>Tomato</option>
        <option>Onion</option>
        <option>Prawn</option>


      </select>

      <input type="date" id="harvestDate">
      <input type="number" id="quantity" data-i18n="quantity_placeholder" placeholder="Quantity (quintals)">
      <input type="text" id="location" data-i18n="location_placeholder" placeholder="Location">

      <div class="modal-actions">
        <button onclick="closeModal()" data-i18n="cancel">Cancel</button>
        <button class="add-btn" onclick="addMember()" data-i18n="add">Add</button>
      </div>
    </div>
  </div>

  <script src="lang.js"></script>
  <script src="community.js"></script>
</body>

</html>
