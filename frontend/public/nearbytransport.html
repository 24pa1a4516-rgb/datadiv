<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  // Dummy location for farmer (New Delhi)
  const farmerLat = 28.6139;
  const farmerLng = 77.2090;
  const farmerRole = "farmer";
  const farmerId = "farmer_web_" + Math.floor(Math.random() * 1000);

  socket.on("connect", () => {
    console.log("Connected as farmer:", farmerId);
    socket.emit("join", { userId: farmerId, role: farmerRole });

    // Request nearby transporters
    requestNearby();
  });

  function requestNearby() {
    socket.emit("getNearby", {
      lat: farmerLat,
      lng: farmerLng,
      quantity: 500 // Example filter
    });
  }

  socket.on("nearbyTransporters", (transporters) => {
    console.log("Received nearby transporters:", transporters);
    const mainContainer = document.querySelector(".main");

    // Clear existing hardcoded cards (except the title)
    const title = mainContainer.querySelector("h2");
    const subtitle = mainContainer.querySelector("p");
    mainContainer.innerHTML = "";
    mainContainer.appendChild(title);
    mainContainer.appendChild(subtitle);

    if (transporters.length === 0) {
      mainContainer.innerHTML += "<p>No transporters found within 50km with sufficient capacity.</p>";
      return;
    }

    transporters.forEach(t => {
      const card = `
        <div class="transporter-card">
          <div class="card-top">
            <h3>${t.name || t.id}</h3>
            <span class="available">${t.status}</span>
          </div>
          <div class="info">📍 ${t.distance.toFixed(1)} km away | 🚛 ${t.truckType || 'Truck'}</div>
          <div class="info">📦 Capacity: ${t.capacity} quintals</div>
          <div class="cost-box">
            <span>Est. cost</span>
            <b>₹${Math.round(t.distance * 25)}</b>
          </div>
          <div class="actions">
            <a href="tel:+919876543210" class="call-btn">📞 Call</a>
            <button class="pickup-btn" onclick="requestPickup('${t.id}')">Request Pickup</button>
          </div>
        </div>
      `;
      mainContainer.innerHTML += card;
    });
  });

  function requestPickup(transporterId) {
    fetch("/api/request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        farmerId: farmerId,
        lat: farmerLat,
        lng: farmerLng,
        quantity: 500,
        crop: "Wheat"
      })
    })
      .then(res => res.json())
      .then(data => {
        alert("Request sent! ID: " + data.requestId);
      });
  }
</script>
